# Takes into the registry every release a vendor certified with shadybin/shadybin's certify
# workflow, and signs it. No person is involved: the expensive work ran on the vendor's
# minutes, and what is signed follows from checks anyone can rerun. The commit history is
# the public record of every signature.
#
# The `signing` environment holds SHADYBIN_SIGNING_KEY and deploys from main only, so no
# branch, pull request or fork can run a job that sees the key.
name: intake

on:
  schedule:
    # Off the quarter hours, which GitHub drops when it is busy.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: intake

permissions: {}

jobs:
  intake:
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write # commit what was signed
      attestations: read
    env:
      # The shadybin that signs is a certified release: v1, which only shadybin's org admins
      # can move. Which certify commits count is .github/certify-commits.
      SHADYBIN_VERSION: v1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: shadybin/shadybin
          ref: ${{ env.SHADYBIN_VERSION }}
          path: .shadybin
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .shadybin/go.mod
          cache: false

      - name: Build shadybin
        run: |
          (cd .shadybin && go build -trimpath -o "$RUNNER_TEMP/bin/shadybin" ./cmd/shadybin)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rm -rf .shadybin

      - name: Take in certified releases
        env:
          GH_TOKEN: ${{ github.token }}
          SHADYBIN_SIGNING_KEY: ${{ secrets.SHADYBIN_SIGNING_KEY }}
        run: .github/intake.sh

      - name: Publish
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "shadybin"
          git config user.email "shadybin@users.noreply.github.com"
          signed=$(git diff --cached --name-only -- '*/statement.txt.sig' | sed 's|/statement.txt.sig||' | paste -sd ' ' -)
          if [ -n "$signed" ]; then message="certify $signed"; else message="update badges and pages"; fi
          git commit -q -m "$message"
          # Someone may have pushed while intake ran: intake only adds files under the
          # projects' directories, so rebasing onto them is safe.
          git pull -q --rebase origin main
          git push

  # GitHub's scheduler does not always run the schedule above (it never did for this
  # repository's first hours), so each run also starts the next, 15 minutes on. A failed
  # or cancelled run breaks the chain; the schedule, or a manual run, starts it again.
  next:
    needs: intake
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: sleep 840
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run intake.yml -R "$GITHUB_REPOSITORY" --ref main
